# This config is used in our integration tests. If we want to modify this for a specific test, you can do so in the SetupConfig function

disableStartupPopups: true
promptToReturnFromSubprocess: false

# Compatibility bindings for integration scenarios that press legacy keybinding
# fields through TestDriver. They are explicit test overrides of upstream
# defaults, not the product keymap. Where an uppercase upstream binding would
# share a case-folded key with another command in the same scope, the lowercase
# command keeps its upstream key and the uppercase one moves to a distinct key.
# Tests of the real defaults must replace the loaded Keybinding value with the
# platform constructor in SetupConfig.
keybinding:
  universal:
    quit: [q, '<c-c>']
    return: '<esc>'
    prevItem: '<up>'
    nextItem: '<down>'
    prevPage: ','
    nextPage: '.'
    scrollLeft: '<alt+h>'
    scrollRight: '<alt+l>'
    gotoTop: '<'
    gotoBottom: '>'
    togglePanel: '<alt+tab>'
    rangeSelectDown: '<shift+down>'
    rangeSelectUp: '<shift+up>'
    jumpToBlock: ['1', '2', '3', '4', '5']
    focusMainView: '0'
    jumpToFile: '<ctrl+g>'
    startSearch: '/'
    optionMenu: '?'
    select: '<space>'
    goInto: '<enter>'
    confirm: '<enter>'
    confirmMenu: '<enter>'
    confirmSuggestion: '<enter>'
    copyToClipboard: '<ctrl+o>'
    remove: d
    new: n
    edit: e
    openFile: o
    openRecentRepos: '<ctrl+r>'
    scrollUpMain: '<pgup>'
    scrollDownMain: '<pgdown>'
    executeShellCommand: ':'
    createRebaseOptionsMenu: m
    pushFiles: '<ctrl+shift+p>'
    pullFiles: p
    refresh: '<f12>'
    createPatchOptionsMenu: '<ctrl+p>'
    nextScreenMode: '+'
    prevScreenMode: '_'
    cycleDiffRenderers: '|'
    cycleDiffRenderersReverse: '\'
    undo: z
    redo: '<ctrl+shift+z>'
    filteringMenu: '<ctrl+s>'
    toggleWhitespaceInDiffView: '<ctrl+w>'
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
    increaseRenameSimilarityThreshold: ')'
    decreaseRenameSimilarityThreshold: '('
    newWorktree: '<f6>'
    diffingMenu: '<f7>'
    toggleRangeSelect: '<f8>'
  status:
    allBranchesLogGraph: a
    allBranchesLogGraphReverse: '<ctrl+alt+b>'
  files:
    commitChanges: c
    commitChangesWithoutHook: '<f9>'
    amendLastCommit: '<ctrl+shift+a>'
    findBaseCommitForFixup: '<ctrl+f>'
    ignoreFile: i
    refreshFiles: r
    stashAllChanges: s
    viewStashOptions: '<ctrl+alt+s>'
    toggleStagedAll: a
    viewResetOptions: '<ctrl+alt+d>'
    fetch: f
    toggleTreeView: '`'
    openMergeOptions: '<ctrl+alt+m>'
    openStatusFilter: '<ctrl+b>'
    copyFileInfoToClipboard: y
    collapseAll: '-'
    expandAll: '='
  branches:
    createPullRequest: o
    viewPullRequestOptions: '<ctrl+alt+o>'
    checkoutBranchByName: c
    checkoutPreviousBranch: '-'
    rebaseBranch: r
    renameBranch: '<ctrl+shift+r>'
    mergeIntoCurrentBranch: '<ctrl+shift+m>'
    moveCommitsToNewBranch: '<ctrl+alt+n>'
    fastForward: f
    createTag: T
    pushTag: '<ctrl+shift+p>'
    setUpstream: u
    addForkRemote: '<ctrl+alt+f>'
    sortOrder: s
  commits:
    pasteCommits: '<f10>'
    amendToCommit: '<ctrl+shift+a>'
    checkoutCommit: '<space>'
    cherryPickCopy: '<ctrl+shift+y>'
    copyCommitAttributeToClipboard: y
    createFixupCommit: '<ctrl+alt+f>'
    tagCommit: '<ctrl+shift+t>'
    markCommitAsBaseForRebase: '<ctrl+alt+b>'
    markCommitAsFixup: f
    moveDownCommit: ['<ctrl+j>', '<alt-down>']
    moveUpCommit: ['<ctrl+k>', '<alt-up>']
    openPullRequestInBrowser: '<ctrl+shift+g>'
    pickCommit: p
    renameCommit: r
    renameCommitWithEditor: '<ctrl+alt+r>'
    resetCherryPick: '<ctrl+r>'
    resetCommitAuthor: a
    revertCommit: t
    selectCommitsOfCurrentBranch: '*'
    setFixupMessage: c
    squashAboveCommits: '<ctrl+alt+s>'
    squashDown: s
    startInteractiveRebase: i
    viewBisectOptions: b
    viewResetOptions: g
  stash:
    popStash: g
    renameStash: r
  commitFiles:
    checkoutCommitFile: c
  main:
    prevHunk: ['<left>', 'h']
    nextHunk: ['<right>', 'l']
    prevFile: '<ctrl+alt+p>'
    nextFile: n
    toggleSelectHunk: a
    pickBothHunks: b
    editSelectHunk: '<ctrl+alt+e>'

gui:
  theme:
    activeBorderColor:
    - green
    - bold
    # Not the "black" of the terminal palette: that is a real black in an
    # ordinary terminal, which makes the frames all but invisible when you run
    # a test with `just e2e-cli`.
    inactiveBorderColor:
    - '#999999'
  # Not important in tests but it creates clutter in demos
  showRandomTip: false
  # The expected output of the tests draws the commit graph with box drawing
  # characters, whichever terminal a test runs in
  commitGraphStyle: classic
  animateExplosion: false # takes too long
git:
  log:
    # Keep legacy integration scenarios on the branch-only log unless they opt in.
    showWholeGraph: false
  # We don't want to run any periodic background git commands because it'll introduce race conditions and flakiness.
  # If we need to refresh something from within the test (which should only really happen if we've invoked a
  # shell command in the background) we should have the user press shift+R to refresh.
  # TODO: add tests which explicitly test auto-refresh functionality
  autoRefresh: false
  autoFetch: false
  autoDetectExternalChanges: false
